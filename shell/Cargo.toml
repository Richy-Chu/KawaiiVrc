[package]
name = "kawaii-shell"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust + WebView2 core for KawaiiVrc (rewrite stage 1)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
