name: Test suite

# The only job that runs every test. The guard probe in lint-workflows drives one filtered
# run, so without this a change could pass CI while hundreds of tests fail.
# Runs on every push: the paths filter on the lint workflow would otherwise skip most of them.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build the test project
        shell: pwsh
        run: dotnet build VrcCompanion.Tests/VrcCompanion.Tests.csproj -c Release -v q --nologo

      - name: Run every test
        shell: pwsh
        run: dotnet test VrcCompanion.Tests/VrcCompanion.Tests.csproj -c Release --no-build --nologo

      # Runs even when the tests fail, so a red run still reports what it left behind. The job
      # fails either way: on the test step or on this one.
      - name: Check the run left no scratch in %TEMP%
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File build/assert-temp-clean.ps1
