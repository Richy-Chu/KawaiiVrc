name: Test suite

# The only job that runs every test. The guard probe in lint-workflows drives one filtered
# run, so without this a change could pass CI while hundreds of tests fail.
# Runs on every push: the paths filter on the lint workflow would otherwise skip most of them.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build the test project
        shell: pwsh
        run: dotnet build VrcCompanion.Tests/VrcCompanion.Tests.csproj -c Release -v q --nologo

      # A flaky test must not redden a commit that is otherwise good, and must not be hidden either:
      # the retry below re-runs only what failed, reports what passed on the second try, and fails
      # the job when a test fails twice. The hang bound turns a hung test into an abort in two
      # minutes instead of a job that runs out its clock with nothing recorded to show for it.
      - name: Run every test
        id: suite
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test VrcCompanion.Tests/VrcCompanion.Tests.csproj -c Release --no-build --nologo `
            --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type none `
            --logger "trx;LogFileName=first.trx" `
            --results-directory "$env:RUNNER_TEMP\results"

      - name: Retry the tests that failed
        if: steps.suite.outcome == 'failure'
        shell: pwsh
        run: pwsh -NoProfile -File build/retry-failed-tests.ps1 -Results "$env:RUNNER_TEMP\results\first.trx"

      # A flake that passed on retry leaves nothing in the job badge, so the job that saw it keeps
      # both runs' results. This runs after a failed retry as well: the evidence matters most when
      # the suite is red. A missing file only warns, since the retry step already fails that case.
      - name: Attach the results of a retried run
        if: steps.suite.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: retried-test-results
          path: |
            ${{ runner.temp }}/results/first.trx
            ${{ runner.temp }}/results/retry.trx
            ${{ runner.temp }}/results/**/Sequence_*.xml
          if-no-files-found: warn
          retention-days: 14

      # Runs even when the tests fail, so a red run still reports what it left behind. The job is
      # red from the retry step or this one; the first test run cannot redden it on its own.
      - name: Check the run left no scratch in %TEMP%
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File build/assert-temp-clean.ps1
