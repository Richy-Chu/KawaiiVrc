name: Lint workflows

# A YAML or expression mistake in .github/workflows otherwise only shows up as a broken
# run after pushing. build/hooks/pre-push runs the same check locally.

on:
  push:
    paths:
      - ".github/workflows/**"
      # The hook and the scripts the workflows call, so touching them re-checks the lint.
      - "build/hooks/**"
      - "build/*.ps1"
      - "build/*.psd1"
      - "build/ReleaseVerifier/**"
      # The guard the probe below exercises, and the project that runs it after VSTest.
      - "VrcCompanion.Tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "build/hooks/**"
      - "build/*.ps1"
      - "build/*.psd1"
      - "build/ReleaseVerifier/**"
      - "VrcCompanion.Tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    # The classification decides whether a failure opens a drift issue, so test it without
    # needing GitHub.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test verifier exit-code classification
        shell: pwsh
        run: pwsh -NoProfile -File build/test-exit-codes.ps1

      - name: Test feed-parity decisions
        shell: pwsh
        run: pwsh -NoProfile -File build/test-feed-parity.ps1

      - name: Test drift reporting
        shell: pwsh
        run: pwsh -NoProfile -File build/test-drift-report.ps1

  profile-guard:
    # The guard watches the Windows profile folder and drives a WPF test project, so this
    # cannot share the Ubuntu runner above. The probe proves the guard's verdict reaches a
    # filtered run's exit code; it appends one entry to the run's own baseline and writes
    # nothing to %LocalAppData%\VrcCompanion.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test the profile guard's red path
        shell: pwsh
        run: pwsh -NoProfile -File build/test-profile-guard-red.ps1

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pinned release; bump it here and in build/hooks/pre-push's install hint together.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          curl -sSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint --version

      # actionlint inspects the bash in run: blocks with shellcheck when it finds it on
      # PATH, so install it before linting. Pinned like actionlint above.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
        run: |
          curl -sSL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf shellcheck.tar.xz "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$PWD/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
          "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --version | head -3

      - name: Lint .github/workflows
        run: |
          ./actionlint -version
          shellcheck --version | head -3
          ./actionlint -color

      # actionlint only looks inside workflows, so lint the pre-push hook directly.
      - name: Lint build/hooks/pre-push
        run: shellcheck build/hooks/pre-push

      # The PowerShell scripts the workflows call are neither YAML nor bash, so nothing
      # else above inspects them. Pinned module; the settings file lists the one excluded
      # rule and why.
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: if (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -eq '1.25.0' }) { Write-Host 'PSScriptAnalyzer 1.25.0 is already available.' } else { Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -ErrorAction Stop }

      - name: Lint build/*.ps1
        shell: pwsh
        run: pwsh -NoProfile -File build/lint-powershell.ps1
