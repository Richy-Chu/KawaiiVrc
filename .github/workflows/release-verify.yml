name: Release verification

# Checks the published releases without building or publishing anything: every release's
# nupkgs must match its own feed, and an install two versions back must still reach the
# latest release through delta patches. Catches feed or chain drift on GitHub, e.g. an
# asset removed by hand, before a user finds it.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Release to verify (defaults to the latest published release)
        required: false
        type: string
      from:
        description: Release to update from (defaults to two releases back)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-verification
  cancel-in-progress: false

jobs:
  verify:
    # Velopack's patcher is Update.exe and the verifier drives it, so this is Windows-only.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The patched nupkg is rebuilt by the Update.exe shipped inside the vpk tool, which
      # the verifier looks up under ~/.dotnet/tools/.store. vpk is released in step with the
      # Velopack package, so read the referenced version instead of pinning one that goes
      # stale the next time Velopack is bumped.
      - name: Install vpk
        shell: pwsh
        run: |
          $projects = @("VrcCompanion/VrcCompanion.csproj", "build/ReleaseVerifier/ReleaseVerifier.csproj")
          $versions = @($projects | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing project file: $_" }
            $match = Select-String -Path $_ -Pattern 'Include="Velopack"\s+Version="([^"]+)"' | Select-Object -First 1
            if (-not $match) { throw "No Velopack PackageReference found in $_." }
            $match.Matches[0].Groups[1].Value
          })

          # A patcher older than the Velopack package would test a different delta path
          # than users run, so a half-finished bump fails here instead of verifying anyway.
          $distinct = @($versions | Sort-Object -Unique)
          if ($distinct.Count -ne 1) {
            throw "Velopack versions disagree: $($projects -join ' and ') reference $($versions -join ' and ')."
          }

          $version = $distinct[0]
          Write-Host "Installing vpk $version to match the referenced Velopack package."
          dotnet tool install --global vpk --version $version
          if ($LASTEXITCODE -ne 0) { throw "vpk $version could not be installed." }

      - name: Verify feeds and delta chain
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          # The project version can be ahead of the published releases while a release is
          # being prepared, so default to what is actually on GitHub.
          $version = "${{ inputs.version }}"
          if (-not $version) {
            $version = gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq ".[].tagName"
            $version = "$version".Trim() -replace "^v", ""
          }
          if (-not $version) { throw "No release to verify on ${{ github.repository }}." }
          Write-Host "Verifying release $version."

          $arguments = @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "build/pack-release.ps1",
            "-VerifyOnly", "-Version", $version
          )
          if ("${{ inputs.from }}") { $arguments += @("-VerifyFrom", "${{ inputs.from }}") }

          pwsh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
